services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sadivacloset-api
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      # hot reload: código local -> container
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - ./nest-cli.json:/app/nest-cli.json
      # evita sobrescrever node_modules do container
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web_sadiva
    command: sh -c "pnpm exec prisma generate && pnpm run start:dev"

  postgres:
    image: postgres:16-alpine
    container_name: sadivacloset-postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sadiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sadiva123}
      POSTGRES_DB: ${POSTGRES_DB:-sadivacloset}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sadiva} -d ${POSTGRES_DB:-sadivacloset}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - web_sadiva

  redis:
    image: redis:7-alpine
    container_name: sadivacloset-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - web_sadiva

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  web_sadiva:
    driver: bridge
    name: web_sadiva
