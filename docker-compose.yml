services:
  postgres:
    image: postgres:16-alpine
    container_name: sadivacloset-postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sadiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sadiva123}
      POSTGRES_DB: ${POSTGRES_DB:-sadivacloset}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sadiva} -d ${POSTGRES_DB:-sadivacloset}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - web_sadivacloset

  redis:
    image: redis:7-alpine
    container_name: sadivacloset-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - web_sadivacloset

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  web_sadivacloset:
    driver: bridge
    name: web_sadivacloset
